[project]
name = "knowledge-pipeline-intelligence"
version = "0.3.1"
description = "Local-first FastAPI, SQLite and Chroma intelligence service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "chromadb>=0.5,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]
rerank = [
  "sentence-transformers>=3,<6",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
