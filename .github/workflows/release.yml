name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: npm ci
      - run: cd server && uv sync --locked --group test
      - run: npm run release:check
      - run: npm run electron:build
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-pipeline-${{ matrix.os }}
          path: release/**
          if-no-files-found: error
